name: AURA evaluation

# Runs the AURA benchmark pipeline in CI:
#   1. ground-truth validation — executes every contract and golden test
#      against the real toolchains (golang-go, default-jdk, node), which
#      cross-validates the bundled subset interpreters (gosim/javasim);
#   2. the unit test suite;
#   3. the offline experiment matrix;
#   4. the OpenAI experiment matrix (only when the OPENAI_API_KEY secret
#      is configured) and uploads results as artefacts.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ground-truth validation (real toolchains)
        run: python bench/scripts/validate_ground_truth.py

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Offline experiment matrix
        run: |
          python experiments/run_matrix.py --provider offline --out results
          python experiments/aggregate.py --results results

      - name: OpenAI experiment matrix
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python experiments/run_matrix.py --provider openai --model gpt-4o-mini --out results-openai
          python experiments/aggregate.py --results results-openai

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-results
          path: |
            results/summary.md
            results/summary.json
            results-openai/summary.md
            results-openai/summary.json
          if-no-files-found: ignore
